name: Build and deploy

# 版を固定せず、その時点で最新の R・R のパッケージ・Python・Python のパッケージ・Quarto・quarto-live で作り直す。
# 描画・推定値の検査・ブラウザの中の例の検査が全部通ったときだけ Cloudflare Workers に公開する（AGENTS.md「版の方針」）。
# 落ちたら公開は前の版のままで、report-failure.yml が Issue を立てる。
on:
  push:
    branches: [main]
    # 文書だけの変更では作り直さない。
    paths-ignore:
      - "**.md"
  pull_request:
  schedule:
    - cron: "0 1 * * 1" # 月曜 10:00 JST
  workflow_dispatch:

permissions:
  contents: read

env:
  # Python のパッケージは公開から3日たった版だけを使う（公開直後に見つかる悪意ある版を避ける。持ち主の方針）。
  UV_EXCLUDE_NEWER: "3 days"

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    # Chrome（ブラウザの中の例の検査）が入っている ubuntu-24.04 に固定する。ubuntu-latest は 2026-10-19 から Ubuntu 26。
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release
          use-public-rspm: true

      # DESCRIPTION の Imports を Posit Public Package Manager のバイナリで入れる。Quarto（最新のリリース）もここで入る。
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          upgrade: "TRUE"
          install-quarto: "true"
          quarto-version: release

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.x"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # 出たばかりの Python にはパッケージのバイナリがまだ無いことがある。そのときは1つ前の版で作り、警告を残す。
      - name: Python のパッケージ
        env:
          PY: ${{ steps.python.outputs.python-path }}
          PY_VERSION: ${{ steps.python.outputs.python-version }}
        run: |
          if ! uv sync --python "$PY"; then
            minor="${PY_VERSION#3.}"
            previous="3.$(( ${minor%%.*} - 1 ))"
            echo "::warning::Python ${PY_VERSION} では依存を入れられなかったので、${previous} で作ります。"
            uv sync --python "$previous"
          fi
          .venv/bin/python --version

      - name: quarto-live を最新のリリースに置き換える
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/r-wasm/quarto-live/releases/latest --jq .tag_name)"
          quarto add "r-wasm/quarto-live@${tag}" --no-prompt
          echo "QUARTO_LIVE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: 描画
        run: quarto render

      - name: 推定値の検査
        run: python3 scripts/check_results.py

      - name: ブラウザの中の例の検査
        run: |
          python3 scripts/serve.py 8765 &
          uv run --no-project --with playwright python scripts/check_live.py http://127.0.0.1:8765

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"

      # 合鍵なしで wrangler を空実行し、設定と _site を読めるかを確かめる（Dependabot の wrangler の PR もここで試される）。
      - name: wrangler の空実行
        run: |
          npm ci --ignore-scripts
          scripts/wrangler.sh deploy --dry-run

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: site
          path: _site
          retention-days: 7

  # Cloudflare の合鍵を使うのは deploy と rollback だけ。どちらも lockfile で固定した wrangler しか動かさない
  # （出力のメールアドレスは scripts/wrangler.sh が伏せる。公開のリポジトリでは Actions のログを誰でも読める）
  # （npm ci --ignore-scripts で、インストール時のスクリプトも走らせない）。R・Python・playwright は合鍵の無いジョブで動かす。
  # 公開は main からの実行だけ（ブランチを指定した手動の起動では配備しない）。
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      before: ${{ steps.before.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"

      - name: wrangler を入れる
        run: npm ci --ignore-scripts

      # 配備か本番の確認が落ちたときに戻す先として、いま本番で動いている版を控える（配備はいつも100%）。
      - name: 配備の前の版を控える
        id: before
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          : "${CLOUDFLARE_API_TOKEN:?repository secret CLOUDFLARE_API_TOKEN is not set}"
          for wait in 0 30 90; do
            sleep "$wait"
            # 工程のシェルは -e で動くので、読み取りの失敗でループが終わらないようにする。
            version="$(scripts/wrangler.sh deployments status --json | jq -r '.versions[0].version_id')" || version=""
            [[ "$version" =~ ^[0-9a-f-]{36}$ ]] && break
          done
          [[ "$version" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::本番で動いている版を読めません（${version}）"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "配備の前に本番で動いている版: ${version}"

      # Cloudflare の API はしばらく 5xx を返すことがある（owndraft、2026-10-12）。同じものを上げ直しても害はないので3回まで試す。
      - name: 配備
        timeout-minutes: 12
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for wait in 0 120 300; do
            sleep "$wait"
            scripts/wrangler.sh deploy --message "CI: ${GITHUB_SHA::7}" && exit 0
          done
          exit 1

  # 配備できたと記録されても、本番に届いていないことがある。合鍵を持たないジョブで、本番の実行環境のページが
  # この実行で作ったものと1バイトも違わないか（作り直した日時が毎回変わるので、毎週の作り直しでも前の版と見分けられる）と、
  # 本番でもブラウザの中の例が動くかを確かめる。
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      URL: https://causal-lab.kkazu.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # 工程の上限に掛かれば、この工程が失敗になり rollback が動く（ジョブの上限だと取り消しになり、動かない）。
      - name: 本番を確かめる
        timeout-minutes: 15
        run: |
          set -uo pipefail
          for wait in 0 15 30 60; do
            sleep "$wait"
            # 一致すれば cmp が最後まで読むので curl も 0 で終わる。違えば cmp か curl が 0 以外を返す。
            if curl -fsSL "${URL}/environment.html" | cmp -s - _site/environment.html; then
              echo "${URL} にこの実行で作った版（${GITHUB_SHA::7}）が届きました。"
              uv run --no-project --with playwright python scripts/check_live.py "$URL"
              exit $?
            fi
          done
          echo "::error::本番の実行環境のページが、この実行で作ったもの（${GITHUB_SHA::7}）と一致しません。"
          exit 1

  # 配備か本番の確認が落ち、本番の版が控えと違えば（失敗と記録されても新しい版が出ていることがある）、控えた版に戻す。
  # 実行は失敗のまま終わるので、report-failure.yml が Issue を立てる。
  rollback:
    needs: [deploy, verify]
    if: ${{ !cancelled() && needs.deploy.outputs.before != '' && (needs.deploy.result == 'failure' || needs.verify.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: "22"

      - name: wrangler を入れる
        run: npm ci --ignore-scripts

      - name: 配備の前の版に戻す
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BEFORE: ${{ needs.deploy.outputs.before }}
        run: |
          set -uo pipefail
          serving() { scripts/wrangler.sh deployments status --json | jq -r '.versions[0].version_id'; }
          now="$(serving)" || now=""
          if [ "$now" = "$BEFORE" ]; then
            echo "本番は配備の前の版（${BEFORE}）のまま。"
            exit 0
          fi
          for wait in 0 30 90; do
            sleep "$wait"
            scripts/wrangler.sh rollback "$BEFORE" -y -m "CI: 本番の確認に落ちたので戻した（${GITHUB_SHA::7}）" || continue
            after="$(serving)" || after=""
            if [ "$after" = "$BEFORE" ]; then
              echo "::error::何が起きたか：配備した版（${now:-読めず}）が本番の確認を通らなかったので、配備の前の版（${BEFORE}）に戻しました。対応：この実行のログで落ちた工程を読み、直してから配備し直します。"
              exit 0
            fi
          done
          echo "::error::何が起きたか：配備した版（${now:-読めず}）が本番の確認を通らず、配備の前の版（${BEFORE}）へ戻す処理も3回とも失敗しました。本番は確認に落ちた版のままの可能性があります。対応：scripts/wrangler.sh rollback ${BEFORE} -y で戻し、本番を確かめます。"
          exit 1
